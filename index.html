<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MCQ Kinh tế chính trị — Luyện đề</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--accent:#4f46e5;--ok:#087443;--bad:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
.wrap{max-width:760px;margin:auto;padding:18px 14px 40px}
header{padding:8px 2px 16px}
h1{font-size:23px;margin:0 0 5px}
.sub{color:var(--muted);font-size:14px}
.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 3px 15px rgba(16,24,40,.05)}
.panel{padding:14px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
select,button{font:inherit;border-radius:11px;padding:10px 12px;border:1px solid var(--line);background:#fff}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.primary{background:var(--accent);color:white;border-color:var(--accent);font-weight:700}
.card{padding:20px}
.top{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:14px}
.q{font-size:19px;line-height:1.55;font-weight:700;margin-bottom:18px;white-space:pre-wrap}
.opt{display:block;width:100%;text-align:left;margin:10px 0;padding:14px;border:1px solid var(--line);border-radius:13px;background:#fff;line-height:1.45}
.opt:hover{border-color:#aab2c5}
.opt.disabled{cursor:default}
.opt.correct{border-color:#12b76a;background:#ecfdf3}
.opt.wrong{border-color:#f04438;background:#fef3f2}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}
.ok{background:#ecfdf3;color:var(--ok)}
.bad{background:#fef3f2;color:var(--bad)}
.feedback{margin-top:14px;padding:12px;border-radius:12px;line-height:1.5}
.feedback.ok{border:1px solid #abefc6}
.feedback.bad{border:1px solid #fecdca}
.nav{display:flex;gap:10px;margin-top:16px}
.nav button{flex:1}
.result{text-align:center;padding:22px}
.score{font-size:42px;font-weight:800;margin:8px 0}
.small{font-size:13px;color:var(--muted)}
.hide{display:none}
.progress{height:7px;background:#eaecf0;border-radius:99px;overflow:hidden;margin-top:10px}
.bar{height:100%;background:var(--accent);width:0;transition:width .2s}
.chapter-list{display:grid;gap:10px}
.chapter-btn{text-align:left;padding:14px}
.chapter-btn strong{display:block;margin-bottom:3px}
.chapter-btn span{font-size:13px;color:var(--muted)}
.review-title{font-size:20px;font-weight:800;margin-bottom:6px}
.review-count{color:var(--muted);font-size:14px}
@media(max-width:520px){
  .wrap{padding:12px 10px 30px}
  .q{font-size:18px}
  .card{padding:16px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>📝 MCQ Kinh tế chính trị</h1>
  <div class="sub">Luyện đề theo từng chương • có review câu sai</div>
</header>

<div id="home" class="panel">
  <div class="row" style="margin-bottom:12px">
    <strong>📚 Chọn chương</strong>
  </div>
  <div id="chapters" class="chapter-list"></div>
</div>

<div id="setup" class="panel hide">
  <div class="row">
    <label>Chế độ:
      <select id="mode">
        <option value="all">Làm tất cả</option>
        <option value="20">20 câu ngẫu nhiên</option>
        <option value="10">10 câu ngẫu nhiên</option>
      </select>
    </label>
    <label><input id="shuffle" type="checkbox" checked> Đảo thứ tự câu</label>
    <button id="start" class="primary">Bắt đầu / Làm lại</button>
    <button id="backHome">← Chọn chương</button>
  </div>
  <div class="progress"><div class="bar" id="bar"></div></div>
</div>

<div id="quiz" class="card hide"></div>
</div>

<script>
/*
  CẤU TRÚC DỮ LIỆU:
  - Mỗi chương là một object trong CHAPTERS.
  - Bạn chỉ cần thêm chương mới vào đây sau này.
  - Câu hỏi có dạng: {n: số_câu_gốc, q: "...", o: ["A","B","C","D"], a: 0}
*/
const CHAPTERS = [
  {
    id: 1,
    title: "Chương 1",
    description: "40 câu hiện tại — câu gốc 31–70",
    bank: [{"n": 31, "q": "Các hiện tượng kinh tế đều bị chi phối bởi:", "o": ["Quy luật kinh tế", "Nhà nước", "Con người", "Chính sách kinh tế"], "a": 0}, {"n": 32, "q": "Ai là người sử dụng thuật ngữ “kinh tế chính trị” lần đầu tiên:", "o": ["Francois Quesnay", "William Petty", "Thomas Mun", "Antoine Montchretien"], "a": 3}, {"n": 33, "q": "Nhận định SAI về chính sách kinh tế:", "o": ["Khi chính sách kinh tế không phù hợp với quy luật kinh tế khách quan thì chủ thể ban hành có thể ban hành chính sách khác để thay thế", "Chính sách kinh tế có thể phù hợp hoặc không phù hợp với quy luật kinh tế khách quan", "Quy luật kinh tế tác động vào các quan hệ lợi ích còn chính sách kinh tế tác động vào hành vi kinh doanh của các chủ thể kinh tế", "Là sản phẩm chủ quan của con người hình thành trên cơ sở vận dụng các quy luật kinh tế"], "a": 2}, {"n": 34, "q": "Quy luật kinh tế phát huy tác động đến nền kinh tế thông qua:", "o": ["Chính sách kinh tế", "Khoa học kinh tế chính trị", "Hoạt động có ý thức của con người trong lĩnh vực kinh tế", "Sự tác động của kiến trúc thượng tầng lên những quan hệ sản xuất tương ứng"], "a": 2}, {"n": 35, "q": "Nhận định SAI về quy luật kinh tế là:", "o": ["Con người không thể thay đổi quy luật kinh tế", "Quy luật kinh tế là sản phẩm chủ quan của con người", "Quy luật kinh tế tồn tại khách quan", "Quy luật kinh tế tác động thông qua hoạt động có ý thức của con người"], "a": 3}, {"n": 36, "q": "Các lý thuyết kinh tế hướng vào phê phán những khuyết tật của chủ nghĩa tư bản trên cơ sở tình cảm cá nhân mà không chỉ ra những quy luật kinh tế được gọi là:", "o": ["Kinh tế chính trị macxit", "Các tư tưởng của các nhà chủ nghĩa xã hội không tưởng", "Kinh tế chính trị Mác - Lenin", "Kinh tế chính trị tầm thường"], "a": 1}, {"n": 37, "q": "Nhận định ĐÚNG về kinh tế chính trị Mác - Lênin là:", "o": ["Mục đích xuyên suốt của kinh tế chính trị Mác - Lênin là thúc đẩy sự giàu có của mỗi người dân và xã hội", "Kinh tế chính trị Mác - Lênin không phải là khoa học về kinh tế hàng hóa của tư bản chủ nghĩa", "Nhiệm vụ của kinh tế chính trị Mác - Lênin là thúc đẩy sự phát triển kinh tế hàng hóa giai đoạn tư bản chủ nghĩa", "Kinh tế chính trị Mác - Lênin hình thành nhằm mục đích giải quyết các mâu thuẫn trong lĩnh vực kinh tế để củng cố và duy trì sự tồn tại và phát triển của chủ nghĩa tư bản"], "a": 1}, {"n": 38, "q": "“Góp phần xây dựng nền tảng tư tưởng mới cho những người lao động tiến bộ biết quý trọng thành quả lao động, yêu chuộng hòa bình, củng cố niềm tin cho mục tiêu xây dựng thành công xã hội chủ nghĩa”. Nhận định này nói đến:", "o": ["Chức năng thực tiễn", "Chức năng tư tưởng", "Chức năng phương pháp luận", "Chức năng nhận thức"], "a": 1}, {"n": 39, "q": "Chức năng cơ bản của kinh tế chính trị Mác - Lênin là:", "o": ["Chức năng khoa học", "Chức năng giai cấp", "Chức năng kinh tế", "Chức năng tư tưởng"], "a": 3}, {"n": 40, "q": "V.I. Lênin mất vào năm:", "o": ["1923", "1921", "1925", "1924"], "a": 3}, {"n": 41, "q": "Có các nhận định về các trường phái kinh tế chính trị như sau: (1) Chủ nghĩa trọng thương phát triển hơn chủ nghĩa trọng nông khi chuyển đối tượng nghiên cứu từ lĩnh vực lưu thông sang lĩnh vực sản xuất; (2) Chủ nghĩa trọng nông là học thuyết kinh tế chính trị đầu tiên nghiên cứu về phương thức sản xuất tư bản chủ nghĩa. Trong đó:", "o": ["(1) và (2) đều sai", "(1) sai, (2) đúng", "(1) và (2) đều đúng", "(1) đúng, (2) sai"], "a": 0}, {"n": 42, "q": "Chủ nghĩa trọng thương xác định đối tượng nghiên cứu của mình trong lĩnh vực:", "o": ["Nền sản xuất", "Nông nghiệp", "Nội thương", "Ngoại thương"], "a": 3}, {"n": 43, "q": "Chủ nghĩa trọng nông xác định đối tượng nghiên cứu của mình trong lĩnh vực:", "o": ["Nền sản xuất", "Thương mại", "Nông nghiệp", "Thương mại (đặc biệt là ngoại thương)"], "a": 2}, {"n": 44, "q": "Phương pháp trừu tượng hóa khoa học là:", "o": ["Gạt bỏ những bộ phận phức tạp của đối tượng nghiên cứu", "Quá trình suy ngẫm về các hiện tượng kinh tế", "Gạt bỏ các hiện tượng ngẫu nhiên, bề ngoài, chỉ giữ lại những mối liên hệ phổ biến mang tính bản chất", "Kết hợp các hiện tượng kinh tế cụ thể để nêu lên quy luật cho nền kinh tế"], "a": 2}, {"n": 45, "q": "Có các nhận định về đối tượng nghiên cứu của các trường phái kinh tế chính trị như sau: (1) Chủ nghĩa trọng nông xác định đối tượng nghiên cứu của mình là hoạt động sản xuất nông nghiệp; (2) Kinh tế chính trị cổ điển Anh đã đề cập đến các phạm trù quan trọng của nền kinh tế như hàng hóa, giá trị, tính chất hai mặt của lao động sản xuất. Trong đó:", "o": ["(1) sai, (2) đúng", "(1) và (2) đều sai", "(1) đúng, (2) sai", "(1) và (2) đều đúng"], "a": 3}, {"n": 46, "q": "Theo A. Smith, chủ thể nghiên cứu kinh tế chính trị là:", "o": ["Các chủ doanh nghiệp", "Cả những nhà kinh tế học lẫn các nhà chính khách", "Các nhà chính khách hay nhà lập pháp", "Các nhà kinh tế học"], "a": 2}, {"n": 47, "q": "“Cung cấp hệ thống lý luận về sự vận động của các quan hệ xã hội trong sản xuất và trao đổi đặt trong mối liên hệ biện chứng với lực lượng sản xuất và kiến trúc thượng tầng”. Nhận định này nói đến:", "o": ["Chức năng thực tiễn", "Chức năng phương pháp luận", "Chức năng tư tưởng", "Chức năng nhận thức"], "a": 3}, {"n": 48, "q": "Nhận định sai về những kết quả nghiên cứu kinh tế chính trị của V.I. Lênin là:", "o": ["V.I. Lênin tiếp tục kế thừa, bổ sung, phát triển lý luận kinh tế chính trị theo phương pháp luận của Mác", "V.I. Lênin đã chỉ ra đặc điểm kinh tế của chủ nghĩa tư bản thời kỳ tích lũy nguyên thủy", "V.I. Lênin nghiên cứu những vấn đề kinh tế chính trị cơ bản của thời kỳ quá độ lên chủ nghĩa xã hội", "V.I. Lênin đã làm rõ đặc điểm kinh tế của chủ nghĩa tư bản giai đoạn cuối thế kỷ XIX, đầu thế kỷ XX"], "a": 1}, {"n": 49, "q": "“Là cơ sở lý luận để người lao động và những nhà hoạch định chính sách hình thành năng lực, kỹ năng vận dụng các quy luật kinh tế vào thực tiễn hoạt động lao động cũng như quản trị quốc gia”. Nhận định này nói đến:", "o": ["Chức năng phương pháp luận", "Chức năng tư tưởng", "Chức năng nhận thức", "Chức năng thực tiễn"], "a": 3}, {"n": 50, "q": "Thuật ngữ “kinh tế chính trị” xuất hiện lần đầu tiên trong tác phẩm:", "o": ["Cộng Hòa", "Chính trị luận", "Chuyên luận về kinh tế chính trị", "Của cải của các dân tộc"], "a": 2}, {"n": 51, "q": "Đặc điểm của quy luật kinh tế là:", "o": ["Phụ thuộc vào hoạt động có ý thức của con người", "Mang tính khách quan", "Có thể thay đổi được", "Mang tính chủ quan"], "a": 1}, {"n": 52, "q": "Chức năng cơ bản của kinh tế chính trị Mác - Lênin là:", "o": ["Chức năng giai cấp", "Chức năng chính trị", "Chức năng khoa học", "Chức năng nhận thức"], "a": 3}, {"n": 53, "q": "Phương pháp nghiên cứu quan trọng nhất của kinh tế chính trị Mác - Lênin là:", "o": ["Trừu tượng hóa khoa học", "Phân tích - tổng hợp", "Điều tra xã hội học", "Mô hình hóa"], "a": 0}, {"n": 54, "q": "Chức năng cơ bản của kinh tế chính trị Mác - Lênin là:", "o": ["Chức năng thực tiễn", "Chức năng khoa học", "Chức năng kinh tế", "Chức năng giai cấp"], "a": 0}, {"n": 55, "q": "Chức năng cơ bản của kinh tế chính trị Mác - Lênin, NGOẠI TRỪ:", "o": ["Chức năng phương pháp luận", "Chức năng giai cấp", "Chức năng tư tưởng", "Chức năng nhận thức"], "a": 1}, {"n": 56, "q": "Nhận định ĐÚNG về chính sách kinh tế:", "o": ["Chính sách kinh tế bắt buộc phải phù hợp với quy luật kinh tế khách quan", "Quy luật kinh tế có thể thay đổi được, còn chính sách kinh tế thuộc về vấn đề chính trị nên không được thay đổi", "Quy luật kinh tế tác động vào các quan hệ lợi ích còn chính sách kinh tế tác động vào hành vi kinh doanh của các chủ thể kinh tế", "Khi chính sách kinh tế không phù hợp với quy luật kinh tế khách quan thì chủ thể ban hành có thể ban hành chính sách khác để thay thế"], "a": 3}, {"n": 57, "q": "“Phương pháp được tiến hành bằng cách nhận ra và gạt bỏ khỏi quá trình nghiên cứu những yếu tố ngẫu nhiên, những hiện tượng tạm thời, gián tiếp và giữ lại những dấu hiệu điển hình, bền vững, ổn định trực tiếp của đối tượng nghiên cứu” được gọi là:", "o": ["Mô hình hóa", "Phân tích - tổng hợp", "Điều tra xã hội học", "Trừu tượng hóa khoa học"], "a": 3}, {"n": 58, "q": "Kinh tế chính trị Mác - Lênin đã kế thừa và phát triển trực tiếp những thành tựu của trường phái:", "o": ["Kinh tế chính trị tầm thường", "Chủ nghĩa trọng thương", "Kinh tế chính trị cổ điển Anh", "Chủ nghĩa trọng nông"], "a": 2}, {"n": 59, "q": "Vấn đề phân tích nguồn gốc và bản chất của cải và sự giàu có của quốc gia thuộc về trường phái:", "o": ["Kinh tế chính trị cổ điển Anh", "Chủ nghĩa trọng thương", "Kinh tế chính trị Mác - Lênin", "Chủ nghĩa trọng nông"], "a": 0}, {"n": 60, "q": "Hệ thống lý luận kinh tế chính trị đầu tiên nghiên cứu về nền sản xuất tư bản chủ nghĩa là:", "o": ["Kinh tế chính trị Mác - Lênin", "Kinh tế chính trị cổ điển Anh", "Chủ nghĩa trọng nông", "Chủ nghĩa trọng thương"], "a": 1}, {"n": 61, "q": "Công trình nghiên cứu, bổ sung và phát triển kinh tế chính trị Mác - Lênin sau khi V.I. Lênin mất cho đến ngày nay được gọi là:", "o": ["Kinh tế chính trị macxit", "Kinh tế chính trị tầm thường", "Kinh tế chính trị phi macxit", "Kinh tế chính trị tư bản chủ nghĩa"], "a": 2}, {"n": 62, "q": "Đặc điểm cơ bản của chủ nghĩa trọng nông là:", "o": ["Đề cao vai trò của hoạt động thương mại (đặc biệt là ngoại thương)", "Đề cao vai trò của hoạt động sản xuất công nghiệp", "Đề cao vai trò của hoạt động thương mại (đặc biệt là nội thương)", "Đề cao vai trò của hoạt động sản xuất nông nghiệp"], "a": 3}, {"n": 63, "q": "Tư tưởng nhấn mạnh vai trò của thương mại, đặc biệt là ngoại thương thuộc về trường phái:", "o": ["Kinh tế chính trị Mác - Lênin", "Kinh tế chính trị cổ điển Anh", "Chủ nghĩa trọng nông", "Chủ nghĩa trọng thương"], "a": 3}, {"n": 64, "q": "Nhận định ĐÚNG về đặc điểm của các lý thuyết kinh tế của các nhà tư tưởng xã hội chủ nghĩa không tưởng và kinh tế chính trị tiểu tư sản là:", "o": ["Kế thừa những luận điểm khoa học, đi sâu vào bản chất của kinh tế chính trị cổ điển Anh để hình thành nên các luận điểm khoa học", "Các lý thuyết kinh tế hướng vào phê phán những khuyết tật của chủ nghĩa tư bản trên cơ sở tình cảm cá nhân mà không chỉ ra những quy luật kinh tế", "Kế thừa những luận điểm mang tính khái quát tâm lý, hành vi của kinh tế chính trị cổ điển Anh", "Hướng vào phê phán những khuyết tật của chủ nghĩa tư bản trên cơ sở tình cảm cá nhân"], "a": 1}, {"n": 65, "q": "Có các nhận định về đối tượng nghiên cứu của các trường phái kinh tế chính trị như sau: (1) Chủ nghĩa trọng thương đặc biệt đề cao vai trò của hoạt động thương mại; (2) Chủ nghĩa trọng nông đã đề cập đến các phạm trù quan trọng của nền kinh tế như hàng hóa, giá trị, tính chất hai mặt của lao động sản xuất. Trong đó:", "o": ["(1) sai, (2) đúng", "(1) và (2) đều đúng", "(1) đúng, (2) sai", "(1) và (2) đều sai"], "a": 2}, {"n": 66, "q": "Sự khác biệt về sự tác động của quy luật kinh tế và chính sách kinh tế đối với nền kinh tế là:", "o": ["Quy luật kinh tế có sự tác động mang tính chủ quan, còn chính sách kinh tế tác động mang tính khách quan", "Quy luật kinh tế có sự tác động mang tính khách quan, còn chính sách kinh tế tác động mang tính chủ quan", "Quy luật kinh tế tác động vào các quan hệ lợi ích còn chính sách kinh tế tác động vào hành vi kinh doanh của các chủ thể kinh tế", "Quy luật kinh tế có thể thay đổi được, còn chính sách kinh tế thuộc về vấn đề chính trị nên không được thay đổi"], "a": 1}, {"n": 67, "q": "Kinh tế chính trị là:", "o": ["Môn khoa học kinh tế nghiên cứu quan hệ giữa kinh tế và chính trị trong các hoạt động và quá trình kinh tế của con người", "Môn khoa học nghiên cứu các quan hệ kinh tế để tìm ra các quy luật chi phối sự vận động của các hiện tượng và quá trình hoạt động kinh tế của con người", "Môn khoa học chính trị nghiên cứu quan hệ biện chứng giữa chính trị và kinh tế trong quá trình quản lý và điều tiết nền kinh tế của nhà nước", "Môn khoa học nghiên cứu các quan hệ kinh tế để tìm ra các quy luật chi phối sự vận động và phát triển của các sự vật, hiện tượng"], "a": 1}, {"n": 68, "q": "Theo C. Mác, ai là người sáng lập nền kinh tế chính trị tư sản cổ điển:", "o": ["A. Smith", "D. Ricardo", "W. Petty", "R. T. Malthus"], "a": 2}, {"n": 69, "q": "Điểm hạn chế cơ bản của chủ nghĩa trọng thương là:", "o": ["Chuyển đối tượng nghiên cứu từ lĩnh vực lưu thông sang lĩnh vực sản xuất", "Tuyệt đối hóa vai trò của sản xuất, xem nhẹ vai trò hoạt động thương mại", "Tuyệt đối hóa vai trò của hoạt động sản xuất nông nghiệp", "Tuyệt đối hóa vai trò của thương mại, xem nhẹ vai trò hoạt động sản xuất"], "a": 3}, {"n": 70, "q": "Đặc điểm cơ bản của chủ nghĩa trọng thương là:", "o": ["Đề cao vai trò của hoạt động sản xuất nông nghiệp", "Đề cao vai trò của hoạt động thương mại (đặc biệt là nội thương)", "Đề cao vai trò của hoạt động thương mại (đặc biệt là ngoại thương)", "Đề cao vai trò của hoạt động sản xuất công nghiệp"], "a": 2}]

  {
    id: 2,
    title: "Chương 2",
    description: "Hàng hóa, thị trường và vai trò của các chủ thể tham gia thị trường",
    bank: [{"n":1,"q":"Nhận định SAI về yêu cầu của quy luật giá trị đối với sản xuất và lưu thông hàng hóa là:","o":["Hao phí lao động cá biệt phải phù hợp với mức hao phí lao động xã hội cần thiết","Lưu thông hàng hoá dựa trên nguyên tắc ngang giá, lấy giá trị xã hội làm cơ sở, không dựa trên giá trị cá biệt","Trao đổi hàng hóa phải được thực theo theo nguyên tắc cung - cầu, lấy giá trị xã hội làm cơ sở","Sản xuất và lưu thông hàng hoá phải dựa trên cơ sở hao phí lao động xã hội cần thiết"],"a":2},{"n":2,"q":"Nhận định ĐÚNG về giá trị sử dụng của hàng hóa:","o":["Giá trị sử dụng của hàng hóa là giá trị sử dụng có thể thỏa mãn nhu cầu cho người mua hàng hóa","Giá trị sử dụng của hàng hóa là giá trị sử dụng có thể thỏa mãn nhu cầu của người bán","Nền sản xuất càng hiện đại, khoa học và công nghệ càng phát triển thì hàng hóa càng có ít giá trị sử dụng hơn và phát hiện nhiều giá trị hơn","Hàng hóa chỉ có thể thỏa mãn nhu cầu cho tiêu dùng và nhu cầu cho sản xuất của người mua"],"a":0},{"n":3,"q":"Đặc điểm của chủ thể người sản xuất trên thị trường là:","o":["Là chủ thể trực tiếp tạo ra của cải vật chất, sản phẩm cho xã hội để phục vụ người tiêu dùng","Làm tăng cơ hội thực hiện giá trị của hàng hóa cũng như thỏa mãn nhu cầu của người tiêu dùng","Đảm bảo nhiệm vụ cầu nối giữa những yếu tố đầu vào và nhu cầu của người tiêu dùng trên thị trường","Thực hiện chức năng quản lý nhà nước về kinh tế, đồng thời khắc phục những khuyết tật của thị trường"],"a":0},{"n":4,"q":"Nhận định ĐÚNG về kinh tế thị trường và cạnh tranh là:","o":["Trong nền kinh tế thị trường, chỉ còn có sự cạnh tranh giữa các chủ thể sản xuất giữa các ngành khác nhau","Kinh tế thị trường phát triển đã thủ tiêu cạnh tranh giữa các chủ thể kinh tế","Kinh tế thị trường càng phát triển thì cạnh tranh trên thị trường dần mất đi","Kinh tế thị trường phát triển thì cạnh tranh càng trở nên thường xuyên hơn, quyết liệt hơn"],"a":3},{"n":5,"q":"Yếu tố quyết định sự phát triển bền vững của người sản xuất là:","o":["Mối quan hệ với nhà nước","Trình độ sản xuất","Vai trò của các chủ thể trung gian","Sức mua của người tiêu dùng"],"a":3},{"n":6,"q":"Công thức lưu thông tiền tệ M = [(P.Q) - (G1 + G2) + G3]/V được dùng để xác định số lượng tiền cần thiết cho lưu thông khi:","o":["Việc thanh toán bằng tiền mặt trở nên phổ biến","Cung về hàng hóa vượt cầu về hàng hóa trên thị trường","Việc thanh toán không bằng tiền mặt trở nên phổ biến","Giá cả hàng hóa lớn hơn giá trị của hàng hóa"],"a":2},{"n":7,"q":"“Tiền tệ là bánh xe vĩ đại của lưu thông”. Là nhận định của nhà kinh tế học:","o":["D. Ricardo","C. Mác","W. Petty","A. Smith"],"a":3},{"n":8,"q":"Nếu lượng tiền đưa vào lưu thông không ăn khớp với lưu thông hàng hóa sẽ dẫn đến:","o":["Trì trệ hoặc lạm phát","Giá trị lớn hơn giá cả","Cung hàng hóa vượt nhu cầu của thị trường","Tăng cường độ cạnh tranh của thị trường"],"a":0},{"n":9,"q":"Nhận định SAI về yêu cầu của quy luật giá trị đối với sản xuất và lưu thông hàng hóa là:","o":["Sản xuất và lưu thông hàng hoá phải dựa trên cơ sở hao phí lao động xã hội cần thiết","Lưu thông hàng hoá dựa trên nguyên tắc ngang giá, lấy giá trị xã hội làm cơ sở, không dựa trên giá trị cá biệt","Sản xuất và lưu thông hàng hoá phải dựa trên cơ sở hao phí lao động cá biệt cần thiết","Trao đổi hàng hóa phải được thực theo theo nguyên tắc cung - cầu, lấy giá trị xã hội làm cơ sở"],"a":2},{"n":10,"q":"Tính chất xã hội của lao động sản xuất hàng hóa được thể hiện ở:","o":["Lao động trừu tượng","Giá trị","Lao động cụ thể","Giá trị sử dụng"],"a":0},{"n":11,"q":"Lao động sản xuất hàng hóa có tính hai mặt, bao gồm lao động trừu tượng và:","o":["Lao động cụ thể","Lao động quá khứ","Lao động vật chất","Lao động tinh thần"],"a":0},{"n":12,"q":"Quy luật giá trị là:","o":["Quy luật kinh tế cơ bản của nền sản xuất hàng hóa","Quy luật tư duy cơ bản của xã hội về kinh tế","Quy luật chủ quan của con người về giá trị trong nền sản xuất xã hội","Quy luật tự nhiên cơ bản của nền sản xuất hàng hóa"],"a":0},{"n":13,"q":"Căn cứ vào vai trò của các yếu tố được trao đổi, mua bán có những loại thị trường cụ thể như:","o":["Thị trường trong nước và thị trường thế giới","Thị trường tiêu dùng và thị trường tư liệu sản xuất","Thị trường hàng hóa và thị trường dịch vụ","Thị trường tự do và thị trường có điều tiết"],"a":1},{"n":14,"q":"Mâu thuẫn cơ bản của sản xuất hàng hoá giản đơn là:","o":["Giữa lao động giản đơn với lao động phức tạp","Giữa lao động tư nhân với lao động xã hội","Giữa giá trị với giá trị sử dụng","Giữa lao động cụ thể với lao động trừu tượng"],"a":1},{"n":15,"q":"Những lao động theo ngành nghề, có mục đích riêng, đối tượng riêng, công cụ lao động riêng và kết quả riêng được gọi là:","o":["Lao động có phương pháp","Lao động có mục đích","Lao động trừu tượng","Lao động cụ thể"],"a":3},{"n":16,"q":"Nhận định đúng về lao động trừu tượng là:","o":["Là phạm trù riêng của kinh tế thị trường","Là phạm trù của mọi nền kinh tế hàng hóa","Là phạm trù riêng của Chủ nghĩa tư bản","Là phạm trù chung của mọi nền kinh tế"],"a":1},{"n":17,"q":"Sự hao phí sức lao động của người sản xuất hàng hoá nói chung không tính đến những hình thức cụ thể được gọi là:","o":["Lao động có trình độ cao, mất nhiều công đào tạo","Lao động cụ thể","Lao động phức tạp","Lao động trừu tượng"],"a":3},{"n":18,"q":"Hàng khuyến dụng là:","o":["Giáo dục","Thuê bao di động","Dịch vụ xe buýt","Một bộ quần áo"],"a":0},{"n":19,"q":"Tính chất tư nhân của lao động sản xuất hàng hóa được thể hiện ở:","o":["Lao động trừu tượng","Giá trị","Giá trị sử dụng","Lao động cụ thể"],"a":3},{"n":20,"q":"Người phát hiện ra tính chất hai mặt của lao động sản xuất hàng hoá là:","o":["C. Mác","D. Ricardo","A. Smith","Ph. Ăngghen"],"a":0},{"n":21,"q":"Nhận định ĐÚNG về giá trị sử dụng của hàng hóa:","o":["Hàng hóa có thể thỏa mãn nhu cầu vật chất và nhu cầu tinh thần; nhu cầu cho tiêu dùng và nhu cầu cho sản xuất","Giá trị sử dụng của hàng hóa chỉ được thực hiện trong quá trình sản xuất","Giá trị sử dụng của hàng hóa là giá trị sử dụng có thể thỏa mãn nhu cầu của người bán","Hàng hóa chỉ có thể thỏa mãn nhu cầu cho tiêu dùng và nhu cầu cho sản xuất của người mua"],"a":0},{"n":22,"q":"Khi đồng thời tăng năng suất lao động và cường độ lao động lên 2 lần thì nhận định ĐÚNG là:","o":["Tổng số hàng hoá tăng lên 2 lần, giá trị 1 hàng hoá giảm 2 lần","Giá trị 1 hàng hoá giảm 2 lần, tổng số giá trị hàng hoá tăng 2 lần","Tổng số hàng hoá tăng lên 4 lần, tổng số giá trị hàng hoá tăng lên 4 lần","Tổng số giá trị hàng hoá tăng 2 lần, tổng số hàng hoá tăng 2 lần"],"a":1},{"n":23,"q":"Nhận định ĐÚNG về yêu cầu của quy luật giá trị đối với sản xuất và lưu thông hàng hóa là:","o":["Sản xuất và lưu thông hàng hoá phải dựa trên cơ sở hao phí lao động cá biệt cần thiết","Người sản xuất luôn tìm cách nâng cao hao phí lao động cá biệt cao hơn hoặc bằng hao phí lao động xã hội cần thiết để thu được nhiều giá trị hơn","Lưu thông hàng hoá dựa trên nguyên tắc ngang giá, lấy giá trị xã hội làm cơ sở, không dựa trên giá trị cá biệt","Trao đổi hàng hóa phải được thực theo theo nguyên tắc cung - cầu, lấy giá trị xã hội làm cơ sở"],"a":2},{"n":24,"q":"Nhận định ĐÚNG về giá trị sử dụng của hàng hóa:","o":["Giá trị sử dụng chỉ được thực hiện trong việc sử dụng hay tiêu dùng","Giá trị sử dụng của hàng hóa chỉ được thực hiện trong quá trình sản xuất","Hàng hóa chỉ có thể thỏa mãn nhu cầu cho tiêu dùng và nhu cầu cho sản xuất của người mua","Giá trị sử dụng của hàng hóa là giá trị sử dụng có thể thỏa mãn nhu cầu của người bán"],"a":0},{"n":25,"q":"Đặc điểm quan trọng của hàng hóa dịch vụ là:","o":["Dịch vụ có thể cất trữ như các hàng hóa khác","Việc sản xuất và tiêu dùng dịch vụ diễn ra đồng thời","Sản xuất dịch vụ đòi hỏi lao động có trình độ cao","Dịch vụ có giá trị lớn hơn các hàng hóa hữu hình"],"a":1},{"n":26,"q":"Trong công thức lưu thông tiền tệ, khối lượng hàng hóa và dịch vụ đưa ra lưu thông được ký hiệu là:","o":["V","Q","P","M"],"a":1},{"n":27,"q":"Trong công thức lưu thông tiền tệ, số vòng lưu thông của đồng tiền được ký hiệu là:","o":["P","V","M","Q"],"a":1},{"n":28,"q":"Chức năng phương tiện cất trữ của tiền tệ yêu cầu:","o":["Tiền phải có đủ giá trị","Phải được quốc tế công nhận","Phải có tiền mặt","Không cần phải có tiền mặt"],"a":2},{"n":29,"q":"Nhận định ĐÚNG về sự xuất hiện của nền sản xuất hàng hóa là:","o":["Xuất hiện sau sự xuất hiện của loài người","Xuất hiện cùng lúc sự xuất hiện của loài người","Con người là hệ quả của nền sản xuất hàng hóa","Xuất hiện trước sự xuất hiện của loài người"],"a":0},{"n":30,"q":"Cạnh tranh là:","o":["Sự ganh đua giữa những chủ thể kinh tế khác ngành với nhau để có được ưu thế về sản xuất cũng như tiêu thụ","Sự ganh đua giữa những chủ thể kinh tế với nhau nhằm có được những ưu thế về sản xuất cũng như tiêu thụ","Sự ganh đua giữa những chủ thể kinh tế trong cùng một ngành với nhau để có được ưu thế về sản xuất cũng như tiêu thụ","Sự hợp tác kết hợp với ganh đua giữa những chủ thể kinh tế trên thị trường nhằm tạo nên sự phát triển chung cho nền sản xuất xã hội"],"a":1},{"n":31,"q":"Khi có sự phân công lao động xã hội, để thỏa mãn nhu cầu của mình thì người sản xuất cần phải:","o":["Trao đổi với các chủ thể sản xuất khác","Tăng cường sản xuất","Thay đổi máy móc, thiết bị mới","Cạnh tranh với các chủ thể sản xuất khác"],"a":0},{"n":32,"q":"Có mối quan hệ trao đổi xA = yB. Tỷ lệ số lượng x trao đổi cho số lượng y được gọi là:","o":["Giá trị trao đổi","Giá cả","Giá trị sử dụng","Giá trị"],"a":0},{"n":33,"q":"Trong các ví dụ sau, chủ thể trung gian trong thị trường là:","o":["Công ty Acecook Việt Nam","Công ty TNHH sản xuất và kinh doanh VinFast","Công ty TNHH nước giải khát Coca Cola Việt Nam","Sàn thương mại điện tử Shopee"],"a":3},{"n":34,"q":"Quan hệ tăng cường độ lao động (CĐLĐ) với giá trị hàng hoá. Chọn ý ĐÚNG:","o":["Tăng CĐLĐ thì tổng giá trị hàng hóa không thay đổi","Giá trị 1 đơn vị hàng hoá tỷ lệ thuận với CĐLĐ","Tăng CĐLĐ thì tổng giá trị hàng hoá tăng lên và giá trị 1 đơn vị hàng hoá cũng tăng lên tương ứng","Tăng CĐLĐ thì giá trị 1 đơn vị hàng hoá không thay đổi"],"a":3},{"n":35,"q":"Cơ chế thị trường là:","o":["Hệ thống các quan hệ mang tính tự điều chỉnh tuân theo yêu cầu của các quy luật kinh tế","Hệ thống các quan hệ mang tính tự điều chỉnh tuân theo yêu cầu của các quy định pháp luật về kinh tế","Hệ thống các quan hệ mang tính tự điều chỉnh tuân theo yêu cầu của quan điểm lợi ích của giai cấp cầm quyền","Hệ thống các quan hệ mang tính tự điều chỉnh tuân theo yêu cầu của các chính sách kinh tế của đất nước"],"a":0},{"n":36,"q":"Nền kinh tế thị trường là:","o":["Nền kinh tế tư bản chủ nghĩa","Nền kinh tế hàng hóa giản đơn","Nền kinh tế chịu sự điều tiết mạnh mẽ của nhà nước","Nền kinh tế được vận hành theo cơ chế thị trường"],"a":3},{"n":37,"q":"Lượng giá trị của đơn vị hàng hoá:","o":["Tỷ lệ nghịch với cường độ lao động","Không phụ thuộc vào năng suất lao động","Tỷ lệ thuận với năng suất lao động","Không phụ thuộc vào cường độ lao động"],"a":3},{"n":38,"q":"Căn cứ vào tính chất và cơ chế vận hành, có những loại thị trường cụ thể như:","o":["Thị trường hàng hóa và thị trường dịch vụ","Thị trường tiêu dùng và thị trường tư liệu sản xuất","Thị trường tự do và thị trường có điều tiết; cạnh tranh hoàn hảo và cạnh tranh không hoàn hảo","Thị trường trong nước và thị trường thế giới"],"a":2},{"n":39,"q":"Hàng hóa cá nhân là:","o":["Là một loại hàng hóa được sản xuất nhằm phục vụ cho nhu cầu của một cá nhân nào đó","Là loại hàng hóa có giới hạn về số lượng, được sản xuất nhằm phục vụ cho nhu cầu của một cá nhân nào đó","Là một loại hàng hóa chỉ do một cá nhân sản xuất ra","Là một loại hàng hóa mà nếu được một người tiêu dùng rồi thì người khác không thể dùng được nữa"],"a":3},{"n":40,"q":"Quy luật lưu thông tiền tệ yêu cầu:","o":["Lưu thông tiền tệ phải dựa trên tình hình cung - cầu hàng hóa","Lưu thông hàng hóa và dịch vụ phải dựa trên tình hình cung - cầu hàng hóa","Lưu thông hàng hóa và dịch vụ phải dựa trên yêu cầu của lưu thông tiền tệ","Lưu thông tiền tệ phải dựa trên yêu cầu của lưu thông hàng hóa và dịch vụ"],"a":3},{"n":41,"q":"Lượng giá trị xã hội của hàng hoá được quyết định bởi:","o":["Hao phí lao động sống của người sản xuất hàng hoá","Hao phí vật tư kỹ thuật","Hao phí lao động cần thiết của người sản xuất hàng hoá","Thời gian lao động xã hội cần thiết"],"a":3},{"n":42,"q":"Cơ sở của tỷ lệ trao đổi giá trị trong chức năng thước đo giá trị là:","o":["Thời gian lao động xã hội cần thiết","Giá trị trao đổi của hàng hóa được đo lường","Thời gian lao động cá biệt","Giá trị sử dụng của hàng hóa được đo lường"],"a":0},{"n":43,"q":"Từng cá nhân có thể trở nên giàu có nhờ mua bán, trao đổi quyền sử dụng đất, bởi vì:","o":["Mua được những mảnh đất có độ phì nhiêu cao","Có số chênh lệch dương giữa số tiền mà họ bỏ ra và số tiền họ thu được","Có số chênh lệch âm giữa số tiền mà họ bỏ ra và số tiền họ thu được","Có số chênh lệch giữa số tiền mà họ bỏ ra và số tiền họ thu được"],"a":1},{"n":44,"q":"Đặc trưng cơ bản nhất của sản xuất hàng hóa là:","o":["Sản xuất ra sản phẩm nhằm mục đích trao đổi, mua bán","Sản lượng hàng hóa lớn","Có áp dụng khoa học công nghệ trong sản xuất","Sản xuất ra sản phẩm nhằm phục vụ nhu cầu tiêu dùng của chính mình"],"a":0},{"n":45,"q":"Căn cứ để xác định lượng tiền cần thiết cho lưu thông trên thị trường là:","o":["Tình hình cung và cầu của hàng hóa trên thị trường","Yêu cầu của lưu thông hàng hóa và dịch vụ","Yêu cầu về lượng giá trị xã hội cần thiết của hàng hóa","Sức mua của đồng tiền trên thị trường"],"a":1},{"n":46,"q":"Nhận định SAI về sự tác động của quy luật giá trị đến sản xuất và lưu thông hàng hóa trên thị trường là:","o":["Phân hóa những người sản xuất thành người giàu, người nghèo một cách tự nhiên","Xác định được số lượng tiền cần thiết cho lưu thông trong mỗi thời kỳ nhất định","Kích thích sự cải tiến kỹ thuật, hợp lý hóa sản xuất nhằm tăng năng suất","Điều tiết sản xuất và lưu thông hàng hóa"],"a":1},{"n":47,"q":"Hai mặt của nền sản xuất xã hội là:","o":["Tích luỹ và cải thiện đời sống","Lực lượng sản xuất và quan hệ sản xuất","Sản xuất và tiêu dùng sản phẩm xã hội","Cơ sở hạ tầng và kiến trúc thượng tầng"],"a":1},{"n":48,"q":"Nhận định ĐÚNG về sản xuất hàng hóa là:","o":["Cả phân công lao động xã hội và sự tách biệt về mặt kinh tế giữa các chủ thể sản xuất là điều kiện cần, con người là điều kiện đủ của sự ra đời của sản xuất hàng hóa","Sự phân công lao động là điều kiện đủ, sự tách biệt về mặt kinh tế giữa các chủ thể sản xuất là điều kiện cần của sự ra đời của sản xuất hàng hóa","Con người không thể dùng ý chí chủ quan để xóa bỏ nền sản xuất hàng hóa khi cả hai điều kiện hình thành nó vẫn tồn tại","Sự phân công lao động là điều kiện khách quan, sự tách biệt về mặt kinh tế giữa các chủ thể sản xuất là điều kiện chủ quan của sự ra đời của sản xuất hàng hóa"],"a":2},{"n":49,"q":"Có các phương thức cạnh tranh giữa các chủ thể sản xuất, kinh doanh như sau: (1) Cải tiến kỹ thuật, đổi mới công nghệ, hợp lý hóa sản xuất; (2) Hạ thấp giá trị cá biệt của hàng hóa xuống thấp hơn mức giá trị xã hội chấp nhận; (3) Tự do di chuyển nguồn lực của mình từ ngành này sang ngành khác. Phương thức cạnh tranh nội bộ ngành là:","o":["(2), (3)","(1), (2)","(1), (3)","(1), (2), (3)"],"a":1},{"n":50,"q":"Đặc điểm của chủ thể người sản xuất trên thị trường là:","o":["Đảm bảo nhiệm vụ cầu nối giữa những yếu tố đầu vào và nhu cầu của người tiêu dùng trên thị trường","Thực hiện chức năng quản lý nhà nước về kinh tế, đồng thời khắc phục những khuyết tật của thị trường","Làm tăng cơ hội thực hiện giá trị của hàng hóa cũng như thỏa mãn nhu cầu của người tiêu dùng","Những người sử dụng các yếu tố đầu vào để sản xuất, kinh doanh và thu lợi nhuận"],"a":3}]

    description: "Giá trị thặng dư trong nền kinh tế thị trường",
    bank: [{"n":1,"q":"Giá trị thặng dư là:","o":["Là toàn bộ phần lao động của công nhân","Là phần lao động sáng tạo của công nhân","Là phần lao động không công của công nhân","Là phần lao động được trả công của người công nhân"],"a":2},{"n":2,"q":"Trong công thức tính khối lượng giá trị thặng dư, giá trị khối lượng giá trị thặng dư được ký hiệu là:","o":["M","v","m'","V"],"a":0},{"n":3,"q":"Một ngày người công nhân làm việc 8 giờ, nếu thời gian lao động tất yếu là 2 giờ thì tỷ suất giá trị thặng dư là:","o":["200%","300%","400%","500%"],"a":1},{"n":4,"q":"Nhận định SAI về đặc điểm của tư bản cho vay là:","o":["Phản ánh đúng nguồn gốc của lợi tức","Giá cả được quyết định bởi giá trị sử dụng","Sau khi sử dụng, giá trị sử dụng không mất đi, giá trị được bảo tồn và tăng lên","Là hình thái phiến diện nhất nhưng được sùng bái nhất"],"a":0},{"n":5,"q":"Một người gửi 700.000 USD tại ngân hàng với kỳ hạn là 1 năm lãi suất 4%/năm. Sau 3 tháng người đó rút toàn bộ tiền ra và gửi với kỳ hạn 9 tháng có lãi suất là 6%/năm. Lợi tức trong 9 tháng cuối năm của người đó nhận được là:","o":["33.815 USD","32.815 USD","31.815 USD","34.850 USD"],"a":2},{"n":6,"q":"Trong công thức tính tỷ suất lợi nhuận, giá trị toàn bộ tư bản ứng trước được ký hiệu là:","o":["p","p'","c + v","c + v"],"a":3},{"n":7,"q":"Nhận định SAI về bản chất của tích lũy tư bản là:","o":["Tích lũy cơ bản là sự tiết kiệm tư bản","Nguồn gốc của tích lũy tư bản là giá trị thặng dư","Tích lũy tư bản là biến một phần giá trị thặng dư thành tư bản","Động cơ của tích lũy tư bản cũng là giá trị thặng dư"],"a":0},{"n":8,"q":"Vai trò của tiền tệ trong công thức lưu thông hàng hóa thị trường tư bản chủ nghĩa là:","o":["Vừa là điểm xuất phát, vừa là điểm kết thúc","Điểm xuất phát, vừa là khâu trung gian","Khâu trung gian và điểm kết thúc","Chỉ giữ vai trò là khâu trung gian"],"a":0},{"n":9,"q":"Chi phí sản xuất, giá tư bản thương nghiệp mua vào, giá tư bản thương nghiệp bán ra. Thứ tự đúng theo giá từ thấp đến cao là:","o":["Ch 500 USD","39.500 USD","38.815 USD"],"a":3},{"n":62,"q":"Chọn ý ĐÚNG về tư bản cho vay:","o":["Người cho vay là người sở hữu tư bản","Người đi vay là người sở hữu tư bản","Người đi vay là người vừa sở hữu và sử dụng tư bản","Người cho vay là người sử dụng tư bản"],"a":0},{"n":63,"q":"Hàng hóa sức lao động mang yếu tố:","o":["Tinh thần và tự do","Tinh thần và lịch sử","Vật chất và lịch sử","Tinh thần và vật chất"],"a":1},{"n":64,"q":"Trong công thức tính tỷ suất lợi nhuận, giá trị (c+v) là:","o":["Tỷ suất lợi nhuận","Lợi nhuận","Tư bản ứng trước","Tư bản cố định"],"a":2},{"n":65,"q":"Địa tô mà địa chủ thu được do chỗ cho thuê mảnh đất đã được đầu tư, thâm canh và làm tăng độ màu mỡ của đất là đặc điểm của:","o":["Địa tô chênh lệch II","Địa tô chênh lệch I","Địa tô tuyệt đối","Địa tô chênh lệch"],"a":0},{"n":66,"q":"Chi phí sản xuất, giá tư bản thương nghiệp mua vào, giá tư bản thương nghiệp bán ra. Thứ tự đúng theo giá từ cao đến thấp là:","o":["Giá tư bản thương nghiệp bán, giá tư bản thương nghiệp mua, chi phí sản xuất","Giá tư bản thương nghiệp mua, chi phí sản xuất, giá tư bản thương nghiệp bán","Chi phí sản xuất, giá tư bản thương nghiệp bán, giá tư bản thương nghiệp mua","Chi phí sản xuất, giá tư bản thương nghiệp mua, giá tư bản thương nghiệp bán"],"a":0},{"n":67,"q":"Một người gửi 500.000 USD tại ngân hàng với kỳ hạn là 1 năm lãi suất 2%/năm. Sau 3 tháng người đó rút toàn bộ tiền ra và gửi với kỳ hạn 9 tháng có lãi suất là 3%/năm. Lợi tức trong 3 tháng đầu của người đó nhận được là:","o":["3.500 USD","1.500 USD","3.000 USD","2.500 USD"],"a":3},{"n":68,"q":"Quá trình sản xuất liên tục được lặp đi lặp lại không ngừng được gọi là:","o":["Sản xuất","Sản xuất tuần hoàn","Sản xuất liên tục","Tái sản xuất"],"a":3},{"n":69,"q":"Quá trình biến một phần giá trị thặng dư thành tư bản phụ thêm gọi là tư bản:","o":["Tái đầu tư giá trị thặng dư","Tái sản xuất giản đơn","Hóa giá trị thặng dư","Hóa giá trị"],"a":2},{"n":70,"q":"Điều kiện hình thành tỷ suất lợi nhuận bình quân, lợi nhuận bình quân và giá cả sản xuất là:","o":["Sự cạnh tranh giữa các ngành, nghề, lĩnh vực sản xuất và kinh doanh","Sức lao động tự do di chuyển giữa các ngành, nghề, lĩnh vực trong nền kinh tế","Tư bản tự do di chuyển giữa các ngành, nghề, lĩnh vực trong nền kinh tế","Tư bản tự do di chuyển và sức lao động tự do di chuyển"],"a":3}]
  }
];

let currentChapter = null;
let set = [];
let idx = 0;
let score = 0;
let answered = false;
let wrongQuestions = [];
let isReview = false;

const $ = id => document.getElementById(id);

function shuffle(a){
  // Fisher-Yates: random ổn định hơn sort(() => Math.random() - .5)
  const out = [...a];
  for(let i=out.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [out[i],out[j]]=[out[j],out[i]];
  }
  return out;
}

function renderChapters(){
  $("chapters").innerHTML = CHAPTERS.map(ch => `
    <button class="chapter-btn" onclick="selectChapter(${ch.id})">
      <strong>${esc(ch.title)}</strong>
      <span>${esc(ch.description)} • ${ch.bank.length} câu</span>
    </button>
  `).join("");
}

function selectChapter(id){
  currentChapter = CHAPTERS.find(ch => ch.id === id);
  if(!currentChapter) return;

  $("home").classList.add("hide");
  $("setup").classList.remove("hide");
  $("quiz").classList.add("hide");

  $("mode").innerHTML = `
    <option value="all">Làm tất cả ${currentChapter.bank.length} câu</option>
    <option value="20">20 câu ngẫu nhiên</option>
    <option value="10">10 câu ngẫu nhiên</option>
  `;
  // Nếu chương ít hơn 20/10 câu thì vẫn giữ UI nhưng start() sẽ giới hạn theo số câu có thật.
  $("bar").style.width = "0%";
}

function goHome(){
  currentChapter = null;
  set = [];
  wrongQuestions = [];
  isReview = false;
  $("setup").classList.add("hide");
  $("quiz").classList.add("hide");
  $("home").classList.remove("hide");
}

function start(){
  if(!currentChapter) return;

  isReview = false;
  const mode = $("mode").value;
  const count = mode === "all" ? currentChapter.bank.length : Math.min(+mode, currentChapter.bank.length);

  set = mode === "all"
    ? [...currentChapter.bank]
    : shuffle(currentChapter.bank).slice(0, count);

  if($("shuffle").checked) set = shuffle(set);

  idx = 0;
  score = 0;
  wrongQuestions = [];
  $("quiz").classList.remove("hide");
  render();
}

function render(){
  const x = set[idx];
  if(!x) return;

  answered = false;
  $("bar").style.width = (idx/set.length*100) + "%";

  const opts = x.o.map((t,i) =>
    `<button class="opt" onclick="choose(${i})"><b>${String.fromCharCode(65+i)}.</b> ${esc(t)}</button>`
  ).join("");

  $("quiz").innerHTML = `
    <div class="top">
      <span>${isReview ? "Review câu sai" : `Câu ${idx+1} / ${set.length}`}</span>
      <span>Gốc: câu ${x.n}</span>
    </div>
    <div class="q">${esc(x.q)}</div>
    ${opts}
    <div id="fb"></div>
    <div class="nav">
      <button onclick="prev()" ${idx===0?'disabled':''}>← Câu trước</button>
      <button class="primary" onclick="next()">${idx===set.length-1 ? "Hoàn thành" : "Câu tiếp →"}</button>
    </div>`;
}

function choose(i){
  if(answered) return;
  answered = true;

  const x = set[idx];
  const buttons = [...document.querySelectorAll(".opt")];

  buttons.forEach((b,k)=>{
    b.classList.add("disabled");
    if(k===x.a) b.classList.add("correct");
  });

  if(i===x.a){
    score++;
    $("fb").innerHTML =
      '<div class="feedback ok"><span class="badge ok">✓ ĐÚNG</span> Chính xác!</div>';
  }else{
    // Lưu câu sai một lần duy nhất trong lượt làm hiện tại.
    wrongQuestions.push({
      question: x,
      selected: i
    });
    buttons[i].classList.add("wrong");
    $("fb").innerHTML =
      `<div class="feedback bad"><span class="badge bad">✗ SAI</span> Đáp án đúng: <b>${String.fromCharCode(65+x.a)}</b>.</div>`;
  }
}

function next(){
  if(!answered){
    $("fb").innerHTML =
      '<div class="feedback bad"><span class="badge bad">⚠ Chưa chọn đáp án</span> Hãy chọn một đáp án trước khi tiếp tục.</div>';
    return;
  }

  if(idx < set.length-1){
    idx++;
    render();
  }else{
    result();
  }
}

function prev(){
  if(idx>0){
    idx--;
    render();
  }
}

function result(){
  $("bar").style.width = "100%";

  const pct = Math.round(score/set.length*100);

  $("quiz").innerHTML = `
    <div class="result">
      <div class="small">HOÀN THÀNH • ${esc(currentChapter.title)}</div>
      <div class="score">${score}/${set.length}</div>
      <div>${pct}% câu đúng</div>

      <div class="nav">
        ${wrongQuestions.length
          ? `<button class="primary" onclick="startReview()">🔄 Review ${wrongQuestions.length} câu sai</button>`
          : `<button class="primary" disabled>✓ Không có câu sai</button>`}
        <button onclick="start()">📝 Làm lại</button>
      </div>

      <div class="nav">
        <button onclick="selectChapter(${currentChapter.id})">⚙ Đổi chế độ</button>
        <button onclick="goHome()">📚 Chọn chương</button>
      </div>
    </div>`;
}

function startReview(){
  if(!wrongQuestions.length) return;

  isReview = true;
  set = wrongQuestions.map(item => item.question);
  idx = 0;
  score = 0;
  wrongQuestions = [];

  $("quiz").classList.remove("hide");
  render();
}

function esc(s){
  return String(s).replace(/[&<>"']/g,m=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  }[m]));
}

$("start").onclick = start;
$("backHome").onclick = goHome;

renderChapters();
</script>
